<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PESO AR STBL (STBL) - El Token Argentino en Arbitrum One</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Librería Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0B132B', 800: '#1C2541', 700: '#2A3A5E', 600: '#3A506B' },
                        gold: { 400: '#FFE17D', 500: '#D4AF37', 600: '#AA820A' },
                        celeste: { 400: '#74ACDF', 500: '#5297D6', 600: '#327ABF' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    boxShadow: {
                        'gold-glow': '0 0 25px -5px rgba(212, 175, 55, 0.3)',
                        'celeste-glow': '0 0 25px -5px rgba(116, 172, 223, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B132B; color: #E2E8F0; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .bg-grid-pattern { background-image: radial-gradient(rgba(116, 172, 223, 0.1) 1px, transparent 1px); background-size: 30px 30px; }
        .gold-gradient-text { background: linear-gradient(135deg, #FFE17D 0%, #D4AF37 50%, #AA820A 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .celeste-gradient-text { background: linear-gradient(135deg, #BDE0FE 0%, #74ACDF 50%, #327ABF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(28, 37, 65, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .glass-card:hover { border-color: rgba(212, 175, 55, 0.5); }
    </style>
</head>
<body class="relative bg-grid-pattern min-h-screen">

    <!-- Navigation -->
    <nav class="sticky top-0 z-40 bg-navy-900/80 backdrop-blur-md border-b border-navy-700/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3 group">
                <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-gold-600 via-gold-500 to-gold-400 p-[2px] shadow-gold-glow">
                    <div class="w-full h-full bg-navy-900 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-coins text-gold-400 text-lg"></i>
                    </div>
                </div>
                <div class="flex flex-col">
                    <span class="font-extrabold text-xl tracking-wider gold-gradient-text">PESO AR STBL</span>
                    <span class="text-[10px] tracking-widest text-celeste-400 font-bold uppercase">Arbitrum One Token</span>
                </div>
            </a>
            <div class="flex items-center gap-3">
                <button id="connectWalletBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-4 py-2 rounded-xl text-sm transition-all shadow-lg flex items-center gap-2">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Conectar Wallet</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="relative pt-12 pb-20 md:pt-20 md:pb-32 overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight">
                <span class="block text-white">PESO AR STBL <span class="text-gold-400">(STBL)</span></span>
                <span class="block text-3xl sm:text-4xl lg:text-5xl mt-2 celeste-gradient-text">El Token Argentino en Arbitrum</span>
            </h1>
            <p class="text-lg text-gray-300 max-w-2xl mx-auto mt-4">
                Estable, transparente y diseñado para transacciones instantáneas con comisiones ínfimas en Arbitrum One.
            </p>
            <div class="mt-6 flex justify-center">
                <code id="contract-address" class="bg-navy-900/90 text-gold-400 text-xs sm:text-sm font-mono px-4 py-3 rounded-xl border border-navy-700">0x846Ad28a11d206058D2Za16b16902F8213b0C30</code>
            </div>
        </div>
    </section>

    <!-- INTERACTIVE SCRIPTS -->
    <script>
        const contractAddress = "0x846Ad28a11d206058D2Za16b16902F8213b0C30";
        const contractABI = [
            "function balanceOf(address account) view returns (uint256)",
            "function transfer(address recipient, uint256 amount) returns (bool)",
            "function decimals() view returns (uint8)",
            "function symbol() view returns (string)"
        ];

        let provider, signer, userAddress, tokenContract;

        document.getElementById("connectWalletBtn").addEventListener("click", async () => {
            if (window.ethereum) {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    userAddress = await signer.getAddress();
                    
                    const shortAddr = userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
                    document.getElementById("connectWalletBtn").innerHTML = `<i class="fa-solid fa-wallet"></i> ${shortAddr}`;
                    
                    tokenContract = new ethers.Contract(contractAddress, contractABI, signer);
                    alert("¡Billetera conectada con éxito!");
                } catch (error) {
                    console.error("Error al conectar billetera:", error);
                    alert("Se canceló la conexión.");
                }
            } else {
                alert("Por favor instalá MetaMask para interactuar con la dApp.");
            }
        });
    </script>
</body>
</html>
