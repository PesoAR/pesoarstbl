<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PESO AR STBL | Stablecoin Argentina</title>
<meta name="description" content="PESO AR STBL - Ecosistema digital en Arbitrum One.">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body { background:#020617; color:#f1f5f9; }
.panel { background:#0f172a; border:1px solid #1e293b; border-radius:20px; }
.field { width:100%; background:#020617; border:1px solid #334155; border-radius:12px; padding:13px; color:white; outline:none; }
.field:focus { border-color:#f59e0b; }
.gold { background:#f59e0b; color:#020617; font-weight:700; }
.gold:hover { background:#fbbf24; }
.action { background:#1e293b; border:1px solid #334155; }
.action:hover { border-color:#f59e0b; }
.tab.active { background:#f59e0b; color:#020617; font-weight:700; }
#qr-code img { margin:auto; padding:8px; background:white; border-radius:8px; }
button:disabled { opacity:.5; cursor:not-allowed; }
a { cursor:pointer; }
.ruleta-container { position: relative; width: 260px; height: 260px; margin: 0 auto; }
.ruleta-wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #f59e0b; position: relative; transition: transform 4s cubic-bezier(0.15, 0.9, 0.2, 1); background: conic-gradient(#3b82f6 0deg 60deg, #10b981 60deg 120deg, #f59e0b 120deg 180deg, #ef4444 180deg 240deg, #8b5cf6 240deg 300deg, #ec4899 300deg 360deg); }
.ruleta-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid #f59e0b; z-index: 10; }
</style>
</head>

<body class="font-sans antialiased">

<script>
"use strict";

const CONFIG = {
    contract: "0x846Ad28a11d206058D2Za16b16902F8213b0C30",
    chainId: 42161,
    chainHex: "0xa4b1",
    chainName: "Arbitrum One",
    rpc: "https://arb1.arbitrum.io/rpc",
    explorer: "https://arbiscan.io",
    uniswap: "https://app.uniswap.org/swap"
};

const ABI = [
    "function balanceOf(address) view returns (uint256)",
    "function transfer(address,uint256) returns (bool)",
    "function decimals() view returns (uint8)",
    "function symbol() view returns (string)"
];

let wallet = null;
let provider = null;
let signer = null;
let token = null;
let userAddress = null;
let decimals = 18;
let symbol = "STBL";
let sessionActive = false;
let toastTimeout = null;

function notify(title, message) {
    const el = document.getElementById("toast");
    if (!el) return;
    document.getElementById("toastTitle").textContent = title;
    document.getElementById("toastMessage").textContent = message;
    el.classList.remove("hidden");
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { el.classList.add("hidden"); }, 6000);
}

function getWallet() {
    if (!window.ethereum) return null;
    if (window.ethereum.providers?.length) {
        return window.ethereum.providers.find(p => p.isMetaMask) || window.ethereum.providers[0];
    }
    return window.ethereum;
}

async function checkNetwork() {
    if (!provider) return false;
    const network = await provider.getNetwork();
    return network.chainId === BigInt(CONFIG.chainId);
}

async function switchNetwork() {
    const w = wallet || getWallet();
    if (!w) throw new Error("No se detectó una billetera compatible.");
    try {
        await w.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CONFIG.chainHex }] });
    } catch (e) {
        if (e.code !== 4902) throw e;
        await w.request({
            method: "wallet_addEthereumChain",
            params: [{
                chainId: CONFIG.chainHex,
                chainName: CONFIG.chainName,
                nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
                rpcUrls: [CONFIG.rpc],
                blockExplorerUrls: [CONFIG.explorer]
            }]
        });
        await w.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CONFIG.chainHex }] });
    }
}

async function initializeConnectedWallet() {
    if (!wallet) throw new Error("Billetera no disponible.");
    provider = new ethers.BrowserProvider(wallet);
    const network = await provider.getNetwork();
    
    if (network.chainId !== BigInt(CONFIG.chainId)) {
        throw new Error("La billetera debe estar en Arbitrum One.");
    }
    
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();
    
    token = new ethers.Contract(CONFIG.contract, ABI, signer);
    
    try {
        decimals = Number(await token.decimals());
        symbol = await token.symbol();
    } catch (err) {
        console.warn("No se pudieron leer decimales/símbolo del contrato, usando valores por defecto:", err);
        decimals = 18;
        symbol = "STBL";
    }

    sessionActive = true;
    updateInterface();
    await refreshBalance();
}

async function connectWallet() {
    const w = getWallet();
    if (!w) {
        notify("MetaMask no detectada", "Instalá o abrilo desde MetaMask.");
        return;
    }
    try {
        wallet = w;
        await wallet.request({ method: "eth_requestAccounts" });
        await switchNetwork();
        await initializeConnectedWallet();
        notify("Conexión exitosa", "Billetera conectada a Arbitrum One.");
    } catch (e) {
        console.error(e);
        notify("Error de conexión", e.shortMessage || e.message || "No se pudo conectar.");
    }
}

function disconnectWallet() {
    sessionActive = false;
    userAddress = null;
    provider = null;
    signer = null;
    token = null;
    wallet = null;
    
    const balanceEl = document.getElementById("balance");
    if (balanceEl) balanceEl.textContent = "-- STBL";
    updateInterface();
    notify("Desconectado", "Sesión cerrada.");
}

function updateInterface() {
    const short = userAddress ? userAddress.slice(0, 6) + "..." + userAddress.slice(-4) : null;
    const connectButton = document.getElementById("connectBtn");
    if (connectButton) {
        connectButton.innerHTML = short ? '<i class="fa-solid fa-wallet"></i> ' + short : '<i class="fa-solid fa-wallet"></i> Conectar Wallet';
        connectButton.classList.toggle("hidden", !!userAddress);
    }

    const discBtn = document.getElementById("disconnectBtn");
    if (discBtn) discBtn.classList.toggle("hidden", !userAddress);

    const userAddrEl = document.getElementById("userAddress");
    if (userAddrEl) userAddrEl.textContent = userAddress || "Billetera desconectada";

    const netStatus = document.getElementById("networkStatus");
    if (netStatus) {
        netStatus.innerHTML = userAddress ? '<i class="fa-solid fa-circle text-green-400"></i> Arbitrum One conectado' : '<i class="fa-solid fa-circle"></i> Sin conexión';
    }

    const buyURL = CONFIG.uniswap + "?chain=arbitrum&inputCurrency=ETH&outputCurrency=" + CONFIG.contract;
    const sellURL = CONFIG.uniswap + "?chain=arbitrum&inputCurrency=" + CONFIG.contract + "&outputCurrency=ETH";

    const buyBtn = document.getElementById("buyButton");
    if (buyBtn) buyBtn.href = buyURL;
    const sellBtn = document.getElementById("sellButton");
    if (sellBtn) sellBtn.href = sellURL;
    const buyLink = document.getElementById("buyLink");
    if (buyLink) buyLink.href = buyURL;
}

async function refreshBalance() {
    try {
        if (!userAddress || !token) return;
        const result = await token.balanceOf(userAddress);
        const formatted = ethers.formatUnits(result, decimals);
        const balanceEl = document.getElementById("balance");
        if (balanceEl) {
            balanceEl.textContent = Number(formatted).toLocaleString("es-AR", { maximumFractionDigits: 6 }) + " " + symbol;
        }
    } catch (e) {
        console.error("Error al actualizar saldo:", e);
    }
}

function showTab(name) {
    document.querySelectorAll(".tabContent").forEach(el => el.classList.add("hidden"));
    document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
    const target = document.getElementById("tab-" + name);
    if (target) target.classList.remove("hidden");
    const button = document.querySelector('[data-tab="' + name + '"]');
    if (button) button.classList.add("active");
}

async function girarRuleta() {
    try {
        if (!userAddress) throw new Error("Conectá tu billetera primero.");
        const apuestaInput = document.getElementById("apuestaRuleta").value;
        const parsedApuesta = ethers.parseUnits(apuestaInput, decimals);
        const balance = await token.balanceOf(userAddress);
        
        if (balance < parsedApuesta) {
            notify("Saldo insuficiente", "No tenés suficiente STBL.");
            return;
        }

        const btnGirar = document.getElementById("btnGirarRuleta");
        if (btnGirar) btnGirar.disabled = true;
        notify("Girando ruleta", "Aguardá el resultado...");

        const wheel = document.getElementById("ruletaWheel");
        const randomDeg = Math.floor(Math.random() * 360) + 1440;
        if (wheel) wheel.style.transform = `rotate(${randomDeg}deg)`;

        setTimeout(async () => {
            const premioFactor = [0, 0.5, 1, 2][Math.floor(Math.random() * 4)];
            const resultadoTxt = premioFactor > 0 ? `¡Ganaste x${premioFactor}!` : "¡Perdiste esta vez!";
            notify("Resultado", resultadoTxt);
            const resText = document.getElementById("resultadoRuletaText");
            if (resText) resText.textContent = resultadoTxt;
            if (btnGirar) btnGirar.disabled = false;
            await refreshBalance();
        }, 4000);
    } catch (e) {
        notify("Error", e.message);
        const btnGirar = document.getElementById("btnGirarRuleta");
        if (btnGirar) btnGirar.disabled = false;
    }
}

document.addEventListener("DOMContentLoaded", () => {
    const ctText = document.getElementById("contractText");
    if (ctText) ctText.textContent = CONFIG.contract;
    updateInterface();
});
</script>

<!-- HEADER -->
<header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800">
<div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
<div class="font-bold text-lg">PESO AR STBL</div>
<div class="flex gap-2">
<button id="connectBtn" onclick="connectWallet()" class="gold px-4 py-3 rounded-xl text-sm"><i class="fa-solid fa-wallet"></i> Conectar Wallet</button>
<button id="disconnectBtn" onclick="disconnectWallet()" class="hidden action px-4 py-3 rounded-xl text-sm text-red-300">Desconectar</button>
</div>
</div>
</header>

<!-- APLICACIÓN -->
<section class="py-12 bg-slate-900/40">
<div class="max-w-7xl mx-auto px-4">
<div class="flex justify-between items-center mb-6">
<h2 class="text-3xl font-bold">Panel dApp</h2>
<div id="networkStatus" class="text-xs text-amber-400 bg-amber-500/10 rounded-full px-4 py-2">Sin conexión</div>
</div>

<div class="panel p-6 mb-6">
<div class="text-xs text-slate-400">SALDO DISPONIBLE</div>
<div id="balance" class="text-4xl font-black text-amber-400 mt-2">-- STBL</div>
<div id="userAddress" class="text-xs text-slate-500 mt-2">Billetera desconectada</div>
<div class="mt-3">
<code id="contractText" class="text-xs text-amber-400 break-all"></code>
</div>
</div>

<!-- PESTAÑAS -->
<div class="grid grid-cols-2 gap-2 mb-6">
<button class="tab active rounded-xl px-3 py-3 text-sm action" data-tab="dashboard" onclick="showTab('dashboard')">Inicio</button>
<button class="tab rounded-xl px-3 py-3 text-sm action" data-tab="ruleta" onclick="showTab('ruleta')">Ruleta</button>
</div>

<!-- INICIO -->
<div id="tab-dashboard" class="tabContent panel p-6">
<h3 class="text-xl font-bold mb-3">Bienvenido</h3>
<p class="text-sm text-slate-400">Seleccioná una pestaña superior para operar o jugar.</p>
<div class="mt-4 flex gap-3">
<a id="buyLink" href="#" target="_blank" rel="noopener noreferrer" class="gold px-4 py-2 rounded-xl text-sm">Comprar STBL</a>
<a id="buyButton" href="#" target="_blank" rel="noopener noreferrer" class="action px-4 py-2 rounded-xl text-sm">Uniswap</a>
<a id="sellButton" href="#" target="_blank" rel="noopener noreferrer" class="action px-4 py-2 rounded-xl text-sm">Vender</a>
</div>
</div>

<!-- RULETA -->
<div id="tab-ruleta" class="tabContent panel p-6 hidden text-center">
<h3 class="text-xl font-bold mb-2">Ruleta STBL</h3>
<div class="ruleta-container my-8">
<div class="ruleta-pointer"></div>
<div id="ruletaWheel" class="ruleta-wheel"></div>
</div>
<div class="max-w-xs mx-auto space-y-4">
<input id="apuestaRuleta" class="field text-center" type="number" min="1" value="10">
<button id="btnGirarRuleta" onclick="girarRuleta()" class="gold w-full py-4 rounded-xl">¡Girar Ruleta!</button>
<div id="resultadoRuletaText" class="text-lg font-bold text-amber-400 mt-3"></div>
</div>
</div>

</div>
</section>

<!-- TOAST -->
<div id="toast" class="fixed bottom-5 right-5 z-[200] hidden max-w-sm">
<div class="bg-slate-900 border border-slate-700 shadow-xl rounded-xl p-4">
<div id="toastTitle" class="font-bold text-amber-400"></div>
<div id="toastMessage" class="text-sm text-slate-300 mt-1"></div>
</div>
</div>

</body>
</html>
