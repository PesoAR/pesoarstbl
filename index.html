<!-- COBROS POS / TRANSFERENCIA FIAT -->
<section id="tab-pos" class="space-y-6 hidden">
<div class="panel p-5 sm:p-6 max-w-xl mx-auto">
<div class="flex items-center gap-2 mb-4">
<span class="text-xl">💳</span>
<h3 class="font-bold text-base sm:text-lg text-white">Terminal de Pagos (POS STBL)</h3>
</div>
<p class="text-xs text-slate-400 mb-4">Ingresá el monto en pesos para calcular los STBL y realizá la transferencia local al alias configurado.</p>

<div class="space-y-4">
<!-- Configuración del Destino (Editable para el negocio) -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-navy-900/60 p-3.5 rounded-xl border border-navy-700">
<div>
<label class="block text-[11px] text-slate-400 mb-1">Titular de la Cuenta</label>
<input type="text" id="posTitular" class="field text-xs py-2" value="VJT Mantenimiento / Comercial">
</div>
<div>
<label class="block text-[11px] text-slate-400 mb-1">Alias de Cobro (ARS)</label>
<input type="text" id="posAlias" class="field text-xs py-2" value="pesoarstbl.mp">
</div>
</div>

<div>
<label class="block text-xs text-slate-400 mb-2">Monto a Cobrar (Pesos ARS)</label>
<input type="number" id="posMontoArs" class="field" placeholder="Ej: 5000" oninput="calcularStblNecesarios()">
</div>

<div class="bg-navy-900 p-4 rounded-xl border border-navy-700 space-y-3">
<div class="flex justify-between text-xs">
<span class="text-slate-400">Equivalente a debitar:</span>
<span id="posStblCalculado" class="text-amber-400 font-mono font-bold">0.00 STBL</span>
</div>
<div class="flex justify-between items-center text-xs pt-2 border-t border-navy-800">
<div>
<span class="text-slate-400 block">Transferir a Alias:</span>
<span id="posAliasDisplay" class="text-emerald-400 font-mono font-bold text-sm">pesoarstbl.mp</span>
<span id="posTitularDisplay" class="text-slate-300 block text-[10px]">Titular: VJT Mantenimiento / Comercial</span>
</div>
<button onclick="copiarAliasPos()" class="bg-navy-800 hover:bg-gold-500 hover:text-navy-900 text-gold-400 px-3 py-1.5 rounded-lg text-xs font-bold transition-all border border-navy-700">
<i class="fa-solid fa-copy"></i> Copiar Alias
</button>
</div>
</div>

<button onclick="enviarAvisoPago()" class="w-full py-3 rounded-xl font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition-all shadow-lg flex items-center justify-center gap-2">
<i class="fa-solid fa-paper-plane"></i> Informar Transferencia Realizada
</button>

<div id="posResultado" class="text-xs text-center font-medium mt-2"></div>
</div>
</div>
</section>
