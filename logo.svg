<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 32 32">

<defs>

<!-- Máscara circular para corte perfecto de 32x32 píxeles -->

<clipPath id="circleClip">

<circle cx="16" cy="16" r="16" />

</clipPath>

</defs>

​<!-- Fondo base -->

<circle cx="16" cy="16" r="16" fill="#12100e"/>

​<!-- Enlace directo a la imagen del logo -->

<g clip-path="url(#circleClip)">

<image width="32" height="32" preserveAspectRatio="xMidYMid slice" href="logo.png"/>

</g>

</svg>